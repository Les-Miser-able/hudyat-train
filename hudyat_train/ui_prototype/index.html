    const categorySelect=()=>`<select aria-label="Category" data-field="category">${categories.map(c=>`<option value="${c.id}"${selected(state.category,c.id)}>${c.name}</option>`).join('')}</select>`;
    const versionSelect=()=>`<select aria-label="Input version" data-field="version"><option value="sequence"${selected(state.version,'sequence')}>Sequence · static + movement</option><option value="static"${selected(state.version,'static')}>Static · held poses</option></select>`;
    const protocolSelect=()=>`<select aria-label="Evaluation protocol" data-field="protocol"><option value="random"${selected(state.protocol,'random')}>Random · 70 / 15 / 15</option><option value="loso"${selected(state.protocol,'loso')}>LOSO · unseen signers</option></select>`;
    const pill=(text,kind='good')=>`<span class="pill ${kind}">${kind==='good'?'<span class="dot"></span>':''}${text}</span>`;
    function stats(){return `<div class="stats">${[['sign','Signs in vocabulary','108','9 categories'],['dataset','Accepted sources','8,610','of 11,340'],['signers','Study signers','07','S1–S7'],['results','Latest accuracy','94.8%','sample run']].map(([i,l,v,s])=>`<div class="stat"><div class="stat-symbol">${icon(i)}</div><div><div class="stat-label">${l}</div><div class="stat-value">${v}<small>${s}</small></div></div></div>`).join('')}</div>`}
    function navRail(){return `<aside class="sidebar">${brand()}<nav class="nav-list" aria-label="Trainer navigation">${[['overview','home','Overview'],['dataset','dataset','Dataset'],['extract','extract','Extract'],['train','train','Train'],['test','test','Test models'],['results','results','Results'],['export','export','Export']].map(([page,i,label])=>`<button class="nav-item ${state.page===page?'active':''}" data-page="${page}" data-tooltip="${label}" aria-label="${label}"${state.page===page?' aria-current="page"':''}>${icon(i)}</button>`).join('')}</nav><div class="sidebar-bottom"><button class="nav-item ${state.page==='settings'?'active':''}" data-page="settings" data-tooltip="Settings" aria-label="Settings">${icon('settings')}</button><button class="nav-item" data-action="about" data-tooltip="About this preview" aria-label="About this preview">${icon('code')}</button></div></aside>`}
    function topbar(){return `<header class="topbar"><div class="workspace-label">${icon('folder')}<span>Workspace</span><b class="slash">/</b><span>HUDYAT Train</span>${icon('down')}<span class="preview-badge">SAMPLE DATA</span></div><div class="top-actions"><span class="local-status"><i class="dot"></i> Local environment</span><button class="icon-btn" data-action="notifications" aria-label="Notifications">${icon('bell')}<i class="notification"></i></button><div class="avatar" aria-label="Local workspace profile">HT</div></div></header>`}
    function pageHeading(title,subtitle,eyebrow='YOUR WORKSPACE'){return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="row"><button class="btn" data-page="results">${icon('results')} View reports</button><button class="btn primary" data-action="configure">${icon('plus')} New training run</button></div></div>`}
    function chartSvg(loss=false){
      const values=Array.from({length:77},(_,i)=>loss?1.75*Math.exp(-i/18)+.13+Math.sin(i*1.9)*.06*(1-i/95):35+61*(1-Math.exp(-i/20))+Math.sin(i*1.72)*3.2*(1-i/90));
      const y=v=>loss?188-v/2.1*155:190-v/100*168;
      const path=values.map((v,i)=>`${i?'L':'M'}${(i/76*588+4).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const train=values.map((v,i)=>`${i?'L':'M'}${(i/76*588+4).toFixed(1)},${y(loss?Math.max(.05,v-.1):Math.min(99,v+3.2)).toFixed(1)}`).join(' ');
      return `<svg class="chart" viewBox="0 0 644 225" role="img" aria-label="Synthetic training and validation ${loss?'loss':'accuracy'} over 76 epochs"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ed8137" stop-opacity=".4"/><stop offset="1" stop-color="#ed8137" stop-opacity="0"/></linearGradient></defs>${[22,65,107,149,191].map((p,i)=>`<path d="M4 ${p}H598" stroke="#ffffff09" stroke-dasharray="3 5"/><text x="609" y="${p+4}">${loss?['2.0','1.5','1.0','0.5','0.0'][i]:['100%','75%','50%','25%','0%'][i]}</text>`).join('')}<path d="${path} L592 191 L4 191Z" fill="url(#chart-fill)"/><path d="${train}" fill="none" stroke="#6ce6ac" stroke-opacity=".85" stroke-width="1.6"/><path d="${path}" fill="none" stroke="#ef9b60" stroke-width="1.8"/><path d="M510 17V191" stroke="#fff" stroke-opacity=".09" stroke-dasharray="3 5"/><circle cx="510" cy="${y(values[65]).toFixed(1)}" r="3.5" fill="#efe7db" stroke="#765b3f" stroke-width="3"/>${[1,15,30,45,60,76].map((v,i)=>`<text x="${i*117+4}" y="216">${v===1?'Epoch 1':v}</text>`).join('')}</svg>`;
    }
    function chartPanel(){return `<section class="panel chart-panel"><div class="panel-head"><div><h2>Model performance</h2><div class="chart-summary"><div class="chart-number">${state.chart==='accuracy'?'94.8<span>%</span>':'0.184'}</div><div class="chart-improvement">↗ ${state.chart==='accuracy'?'+3.5% vs. previous run':'Converging steadily'}</div></div><div class="chart-subtitle">${state.chart==='accuracy'?'Validation accuracy':'Validation loss'} · ${currentCategory().name} / ${state.version==='sequence'?'Sequence':'Static'} · sample curve</div></div><div class="segmented" aria-label="Chart metric"><button class="${state.chart==='accuracy'?'active':''}" data-chart="accuracy" aria-pressed="${state.chart==='accuracy'}">Accuracy</button><button class="${state.chart==='loss'?'active':''}" data-chart="loss" aria-pressed="${state.chart==='loss'}">Loss</button></div></div><div class="chart-wrap">${chartSvg(state.chart==='loss')}<div class="chart-tip">Epoch 65 ↗<strong>${state.chart==='accuracy'?'93.2% validation':'0.212 val. loss'}</strong></div></div><div class="chart-footer"><span>Conv1D–BiLSTM <span class="mono"> / ${state.version==='static'?'held pose':'32 frames'}</span></span><div class="legend"><span><i class="mint"></i>Training</span><span><i></i>Validation</span></div></div></section>`}
    function coverage(){return `<section class="panel coverage-panel"><div class="panel-head"><div><h2>Dataset coverage</h2><div class="subtext">Accepted sources by category</div></div><button class="text-btn" data-page="dataset">Explore ${icon('arrow')}</button></div><div class="bars">${categories.slice(0,6).map((c,i)=>`<div class="bar-group"><span class="bar-value">${Math.round(c.sources/c.target*100)}%</span><div class="bar ${i===0?'highlight':''}" style="height:${c.sources/c.target*89}px" title="${c.name}: ${c.sources} of ${c.target}"></div><span class="bar-label">${['Alpha','Num','Greet','Cal','Shape','Color'][i]}</span></div>`).join('')}</div><div class="coverage-note"><span><span class="green">8,610</span> / 11,340 target sources</span><span>75.9%</span></div></section>`}
    function featureCard(){return `<section class="feature-card"><h2>Make every<br>sign count.</h2><p>From a hand movement<br>to a model that understands.</p><div class="feature-hand">${hand()}</div><button class="btn light" data-page="test">Open recognition lab ${icon('arrow')}</button></section>`}
    function runCard(){const running=state.job==='running',paused=state.job==='paused',finished=state.job==='completed';const epoch=state.epoch||76;return `<section class="run-card"><div class="row between run-card-head"><span>${running?'Training in progress':paused?'Training paused':finished?'Run complete':'Training workspace'}</span><span class="tag">${running||paused?'SIMULATED':'PREVIEW'}</span></div><div class="model-stack"><div class="model-tab">HUDYAT / ${state.version.toUpperCase()}</div><div class="model-tab second">Conv1D–BiLSTM ${state.protocol==='loso'?'· 7 folds':'· random split'}</div><div class="model-face"><div class="row between"><div class="eyebrow">YOUR MODEL</div>${icon('train')}</div><div class="model-title">${currentCategory().name}</div><div class="model-kind">${state.version==='sequence'?'Static + moving signs':'Held-pose comparison'} · ${state.version==='static'&&state.category==='alphabet'?24:currentCategory().signs} classes</div><div class="model-metrics"><div><div class="subtext" style="font-size:9px">Validation accuracy</div><div class="model-score">${running||paused?(86+epoch/Math.max(state.epochs,1)*9.2).toFixed(1):'94.8'}<small>%</small></div></div>${pill(finished?'Complete':'↗ 3.5%')}</div></div></div><div class="run-progress"><div class="row between"><span>${running||paused?'Epoch '+state.epoch+' / '+state.epochs:'Ready for your next experiment'}</span><span>${running?'Running':paused?'Paused':finished?'100%':'Local'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${running||paused||finished?state.epoch/state.epochs*100:100}%"></div></div></div><div class="run-buttons"><button class="btn" data-action="${running||paused?'pause':'configure'}">${icon(running?'pause':paused?'play':'settings')}${running?'Pause':paused?'Resume':'Configure'}</button><button class="btn primary" data-action="${running||paused?'cancel':'start'}">${icon(running||paused?'stop':'play')}${running||paused?'Cancel run':'Start training'}</button></div><div class="run-card-bottom">${icon('shield')}<span>Sample workspace · no real jobs started</span></div></section>`}
    function recent(){return `<section class="recent-panel"><div class="panel-head"><h2>Recent experiments</h2><button class="text-btn" data-page="results">View all ${icon('arrow')}</button></div>${runs.slice(0,3).map(r=>`<button class="recent-item" data-run="${r.id}"><span class="recent-icon">${icon(r.category==='Numbers'?'dataset':'train')}</span><span><span class="recent-name">${r.category} <span class="muted">/ ${r.version}</span></span><span class="recent-meta" style="display:block">${r.date} · ${r.protocol}</span></span><span class="recent-score">${r.accuracy}%<small>accuracy</small></span></button>`).join('')}</section>`}

    function datasetPage(){return `${pageHeading('Every recording starts here.','Explore accepted sources across your nine sign categories.','DATASET / SAMPLE WORKSPACE')}<div class="row between" style="margin-bottom:20px"><span class="subtext">8,610 accepted sources · 108 signs · S1–S7</span><button class="btn" data-action="scan">${icon('refresh')} Scan dataset</button></div>${categoryCards()}<div class="panel" style="margin-top:22px"><div class="panel-head"><div><h2>${currentCategory().name} · signer coverage</h2><p class="subtext">Study target: 15 independent takes per sign, per signer.</p></div>${pill(currentCategory().sources===currentCategory().target?'Study coverage ready':'Collect more takes',currentCategory().sources===currentCategory().target?'good':'warn')}</div><div class="folds">${Array.from({length:7},(_,i)=>`<div class="fold">Signer S${i+1}<b>${Math.round(currentCategory().sources/7)}</b><small>sources</small></div>`).join('')}</div><div class="notice">${icon('shield')}<span>Sample counts illustrate the layout. The prototype does not scan your files.</span></div></div>`}
    function extractPage(){return `${pageHeading('Turn movement into meaning.','Prepare the same 32-frame model inputs used by the trainer.','LANDMARK EXTRACTION')}<div class="two-column"><section class="panel"><h2>Extraction setup</h2><p class="subtext" style="margin-top:7px">Choose a category and input version to preview extraction.</p><div class="form-grid" style="margin-top:23px"><label class="field">Category${categorySelect()}</label><label class="field">Input version${versionSelect()}</label></div><div class="pipeline">${[['folder','Original media','Read in place'],['sign','Hand landmarks','80% detection gate'],['train','Model inputs',state.category==='family'?'32 × 141 features':'32 × 128 features']].map(([i,t,s],n)=>`${n?icon('arrow'):''}<div class="pipeline-step">${icon(i)}${t}<small>${s}</small></div>`).join('')}</div><div class="notice">${icon('shield')}<span>Detection quality is measured inside the sign window. Family includes hand-to-face location. Raw media stays in place.</span></div><button class="btn primary" data-action="extract">${icon('extract')} ${state.extracted?'Preview extraction again':'Preview extraction'}</button>${state.extracted?'<div class="log"><span class="green">SIMULATED EXTRACTION COMPLETE</span><br>Prepared sample index · original media untouched<br>32 frames per source · quality gates applied</div>':''}</section><aside>${runCard()}</aside></div>`}
    function trainingFields(){return `<div class="form-grid"><label class="field">Category${categorySelect()}</label><label class="field">Input version${versionSelect()}</label><label class="field">Evaluation protocol${protocolSelect()}</label><label class="field">Maximum epochs<input type="number" aria-label="Maximum epochs" min="1" max="150" value="${state.epochs}" data-field="epochs"></label></div><div class="divider"></div><div class="row between" style="margin-bottom:16px"><h3>Data augmentation</h3>${pill('Training split only')}</div><div class="form-grid"><label class="field">Augmented copies per original<select aria-label="Augmented copies per original" data-field="augmentation">${[0,3,5].map(n=>`<option value="${n}"${selected(state.augmentation,n)}>${n===5?'5 · study default':n===0?'Off':'3 · development'}</option>`).join('')}</select></label><label class="field">Left / right mirroring<select aria-label="Left / right mirroring" data-field="mirroring"><option value="all"${selected(state.mirroring,'all')}>All signs</option><option value="approved"${selected(state.mirroring,'approved')}>Approved signs only</option><option value="off"${selected(state.mirroring,'off')}>Off</option></select></label></div><p class="subtext" style="margin-top:12px">Noise, scaling, rotation and timing changes. Five copies plus the original provide six training samples per source.</p><div class="divider"></div><label class="check"><input type="checkbox" data-field="development"${state.development?' checked':''}>Development run</label><p class="subtext" style="margin:8px 0 0 25px">Allow incomplete coverage, fewer epochs or non-default augmentation.</p>`}
    function trainingPage(){return `${pageHeading('A new experiment. A new possibility.','Configure a Conv1D–BiLSTM run with the study’s existing settings.','TRAIN / CONFIGURE')}<div class="two-column"><section class="panel">${trainingFields()}<div class="notice">${icon('shield')}<span>${state.protocol==='loso'?'Each signer is held out once. Training, validation and test signers stay separate.':'Stratified 70 / 15 / 15 split. Augmentation happens after splitting; held-out sources stay unmodified.'}</span></div><button class="btn primary" data-action="start">${icon('play')} Start simulated training</button></section><aside class="stack">${runCard()}<section class="panel"><h3>Study configuration</h3>${[['Optimizer','Adam · 0.001'],['Batch size','32'],['Early stopping','20 epochs'],['Random seed','42'],['Model input',state.category==='family'?'32 × 141':'32 × 128']].map(([a,b])=>`<div class="setting-line"><span>${a}</span><b style="font-weight:400">${b}</b></div>`).join('')}</section></aside></div>`}
    function testPage(){return `${pageHeading('Give your model a hand.','Try the shape of a recognition session with a simulated prediction.','TEST MODELS / RECOGNITION LAB')}<div class="two-column"><section class="panel"><div class="panel-head"><h2>Recognition preview</h2>${pill('Simulated camera','warn')}</div><div class="camera-stage"><span class="camera-label">${icon('test')}<span style="display:inline-block;margin-top:6px">NO CAMERA CONNECTED</span></span>${hand()}<div class="camera-caption">Illustrative landmarks · no camera access or recording</div></div><div class="row between" style="margin-top:18px"><span class="subtext">${currentRun().category} / ${currentRun().version} · ${currentRun().id}</span><button class="btn" data-action="simulate-browser">${icon('test')} HUDYAT simulator</button></div></section><aside class="panel"><h2>Test a sign</h2><p class="subtext" style="margin-top:6px">Use a completed Alphabet sample model.</p><label class="field" style="margin-top:23px">Expected sign<select aria-label="Expected sign" data-field="testSign">${['A','B','C','D','E'].map(l=>`<option${selected(l,state.testSign)}>${l}</option>`).join('')}</select></label><div class="prediction"><strong class="${state.prediction?'green':'muted'}">${state.prediction?state.testSign:'—'}</strong><p>${state.prediction?'Simulated match · 96.4% confidence':'Ready when you are'}</p></div><button class="btn primary full" data-action="capture">${icon('play')} ${state.prediction?'Try another capture':'Simulate capture'}</button><div class="notice">${icon('shield')}<span>Visual demonstration only. This does not measure recognition accuracy or device response time.</span></div></aside></div>`}
    function runRows(compact=false){let visible=runs.filter(r=>(state.runFilter==='all'||r.protocol.toLowerCase()===state.runFilter)&&(!state.query||`${r.id} ${r.category} ${r.version}`.toLowerCase().includes(state.query.toLowerCase())));return visible.length?visible.map(r=>`<tr data-run="${r.id}" class="${state.selectedRun===r.id?'selected-row':''}" tabindex="0" aria-label="Inspect ${r.id}"><td><div class="row">${icon('train')}<div>${r.id}<div class="subtext">${r.date}</div></div></div></td><td>${r.category}<div class="subtext">${r.version}</div></td><td>${r.protocol==='LOSO'?'LOSO · 7 folds':'Random split'}</td><td>${pill(r.status,r.status==='Development'?'warn':'good')}</td><td class="green">${r.accuracy.toFixed(1)}%</td><td>${r.f1.toFixed(1)}%</td>${compact?'':`<td>${r.epochs}</td>`}<td><button class="icon-btn" data-run="${r.id}" aria-label="Open ${r.id}">${icon('chevron')}</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty">No sample runs match your filters.</td></tr>`}
    function resultsPage(){return `${pageHeading('Small experiments. Clearer answers.','Compare runs and inspect the metrics behind each model.','RESULTS / EXPERIMENT HISTORY')}<div class="panel"><div class="panel-head"><h2>Recorded experiments <span class="muted" style="font-size:11px;margin-left:8px">07 sample runs</span></h2><select aria-label="Filter protocol" data-field="runFilter" style="width:155px"><option value="all"${selected(state.runFilter,'all')}>All protocols</option><option value="random"${selected(state.runFilter,'random')}>Random split</option><option value="loso"${selected(state.runFilter,'loso')}>LOSO</option></select></div><div class="table-wrap"><table><thead><tr><th>Run</th><th>Model</th><th>Protocol</th><th>Status</th><th>Accuracy</th><th>Macro F1</th><th>Epochs</th><th><span class="visually-hidden">Inspect</span></th></tr></thead><tbody>${runRows()}</tbody></table></div></div><div class="notice">${icon('shield')}<span>These are synthetic comparison results. Random split and LOSO evaluate different conditions; a sample score is not study evidence.</span></div>`}
    function exportPage(){const r=currentRun();return `${pageHeading('Ready for the next chapter.','Preview a browser-compatible model bundle before export.','EXPORT / HUDYAT')}<div class="two-column"><section class="panel"><div class="panel-head"><h2>Selected model</h2>${pill('Sample release')}</div><div class="model-title">${r.category} <span class="muted">/ ${r.version}</span></div><p class="subtext" style="margin-top:9px">${r.id} · ${r.protocol} · ${r.accuracy}% sample accuracy</p><div class="bundle-tree">exports/${r.version.toLowerCase()}/\n├─ catalog.json\n├─ models/${r.category.toLowerCase()}/preview/\n│  ├─ model.json\n│  ├─ weights.bin\n│  └─ parity.json\n└─ shared/\n   └─ hand_landmarker.task</div><div class="notice">${icon('shield')}<span>${r.protocol==='LOSO'?'LOSO checkpoints are evaluation artifacts. Choose a completed random-split run for export.':'Loader parity is a compatibility check. Recognition accuracy and response time still need testing in HUDYAT.'}</span></div><button class="btn primary" data-action="export" ${r.protocol==='LOSO'?'disabled':''}>${icon('export')} Preview export bundle</button><button class="text-btn" style="margin-left:16px" data-page="results">Choose another run ${icon('arrow')}</button></section><aside>${runCard()}</aside></div>`}

    function studio(){return `<div class="shell">${navRail()}<main class="workspace">${topbar()}${pages[state.page]()}<footer class="workspace-foot"><span class="foot-mark"><i class="dot"></i> HUDYAT Train <span class="slash">/</span> Built for the language of movement.</span><span>Design preview · synthetic data · local only</span></footer></main></div>`}
    function focus(){let stepBody=state.step===0?`<div class="eyebrow">STEP 01 / YOUR DATA</div><h2>Start with the right signs.</h2><p class="subtext">Choose a category. Source counts illustrate study readiness.</p><label class="field">Category${categorySelect()}</label><div style="margin-top:19px" class="camera-stage">${hand()}<div class="camera-caption">${currentCategory().name} · ${currentCategory().signs} signs · 7 signers</div></div><div class="review-grid"><div class="review-number"><span class="eyebrow">ACCEPTED</span><div class="review-value">${number(currentCategory().sources)}</div></div><div class="review-number"><span class="eyebrow">COVERAGE</span><div class="review-value ${currentCategory().sources===currentCategory().target?'green':'orange'}">${Math.round(currentCategory().sources/currentCategory().target*100)}%</div></div></div>`:state.step===1?`<div class="eyebrow">STEP 02 / YOUR EXPERIMENT</div><h2>Give your model a direction.</h2><p class="subtext">Use the established architecture. Choose the evaluation.</p>${trainingFields()}`:`<div class="eyebrow">STEP 03 / READY TO BEGIN</div><h2>One last look. Then, progress.</h2><p class="subtext">Your sample run is configured and ready for a simulation.</p>${[['Category',currentCategory().name],['Input',state.version==='sequence'?'Sequence · 32 frames':'Static · repeated held pose'],['Evaluation',state.protocol==='random'?'Stratified random · 70 / 15 / 15':'LOSO · seven signer folds'],['Maximum epochs',state.epochs],['Augmentation',state.augmentation+' copies · mirroring '+state.mirroring],['Run type',state.development?'Development':'Study']].map(([a,b])=>`<div class="setting-line"><span>${a}</span><b style="font-weight:400">${b}</b></div>`).join('')}<div class="notice">${icon('shield')}<span>Training and held-out data stay separate. This preview simulates progress without starting a training job.</span></div>${state.job==='running'||state.job==='paused'?`<div class="log"><span class="green">${state.job.toUpperCase()}</span> · Epoch ${state.epoch} / ${state.epochs}<br>Sample validation accuracy: ${(86+state.epoch/state.epochs*9.2).toFixed(1)}%</div>`:''}`;return `<div class="focus-shell"><header class="focus-topbar"><div class="wordmark">${brand()}HUDYAT <span>/ TRAIN STUDIO</span></div><div class="row"><span class="preview-badge">DESIGN B / SAMPLE DATA</span><button class="btn" data-action="go-studio">${icon('home')} Workspace</button><div class="avatar">HT</div></div></header><main class="focus-layout"><aside class="focus-intro"><div class="eyebrow">A LITTLE MORE INTENTION.</div><h1>Better models<br>start here.</h1><p>A focused path from your recordings to your next experiment.</p><nav class="steps" aria-label="Training steps">${[['01','Choose data','Category & coverage'],['02','Shape the run','Model & evaluation'],['03','Make it happen','Review & train']].map(([n,t,s],i)=>`<button class="step ${state.step===i?'active':''}" data-step="${i}" aria-current="${state.step===i?'step':'false'}"><span class="step-number">${i<state.step?'✓':n}</span><span><strong>${t}</strong><small>${s}</small></span></button>`).join('')}</nav><div class="focus-note" style="margin-top:32px"><b>One category. One model.</b>Your raw recordings stay in place. Every experiment gets its own results.</div></aside><section class="focus-editor">${stepBody}<div class="focus-bottom">${state.step?'<button class="text-btn" data-action="step-back">← Back</button>':'<span class="subtext">Sample data · in-memory preview</span>'}<button class="btn primary" data-action="${state.step===2?'start':'step-next'}">${state.step===2?'Start simulated run':'Continue'} ${icon(state.step===2?'play':'arrow')}</button></div></section><aside class="focus-aside">${runCard()}<div class="focus-note"><b>Made for movement.</b>Sequences retain motion across 32 frames. The separate static version compares held poses.<br><br><span class="green">S1–S7</span> · seven study signers</div></aside></main></div>`}
    function runroom(){const r=currentRun();return `<div class="runroom-shell"><header class="runroom-nav"><div class="wordmark">${brand()}HUDYAT <span>/ TRAIN</span></div><nav class="horizontal-nav" aria-label="Workspace navigation">${[['results','Experiments'],['dataset','Dataset'],['train','Train'],['test','Test models'],['export','Export']].map(([p,l])=>`<button class="${(state.page==='overview'&&p==='results')||state.page===p?'active':''}" data-page="${p}">${l}</button>`).join('')}</nav><div class="row"><span class="preview-badge">DESIGN C / SAMPLE DATA</span><div class="avatar">HT</div></div></header><main class="runroom-content">${state.page==='results'||state.page==='overview'?`${pageHeading('The evidence behind your next model.','Compare experiments. Inspect a run. Decide what moves forward.','EXPERIMENT WORKSPACE')}<div class="runroom-summary"><div><div class="stat-label">Completed experiments</div><div class="stat-value">06 <small>+ 1 development</small></div></div><div><div class="stat-label">Best sample accuracy</div><div class="stat-value green">96.1%</div></div><div><div class="stat-label">Evaluation protocols</div><div class="stat-value">02 <small>Random / LOSO</small></div></div><div><div class="stat-label">Data source</div><div class="stat-value" style="color:var(--muted)">Synthetic</div></div></div><div class="runroom-layout"><div><div class="runroom-toolbar"><label class="visually-hidden" for="run-search">Search experiments</label><input id="run-search" placeholder="Search experiments…" value="${escapeText(state.query)}" data-field="query"><select aria-label="Filter protocol" data-field="runFilter"><option value="all"${selected(state.runFilter,'all')}>All protocols</option><option value="random"${selected(state.runFilter,'random')}>Random split</option><option value="loso"${selected(state.runFilter,'loso')}>LOSO</option></select><span class="grow"></span><button class="btn small" data-action="clear-filters">${icon('refresh')} Reset</button></div><div class="runroom-table"><table><thead><tr><th>Run / date</th><th>Model</th><th>Evaluation</th><th>Status</th><th>Accuracy</th><th>Macro F1</th><th><span class="visually-hidden">Inspect</span></th></tr></thead><tbody>${runRows(true)}</tbody></table><div class="detail-strip"><span>Study targets <b>Accuracy ≥85%</b></span><span><b>Macro F1 ≥85%</b></span><span><b>Per-sign recall ≥70%</b></span></div></div><section class="mini-chart"><div class="panel-head"><div><h2>Learning trajectory <span class="muted" style="font-size:11px;margin-left:9px">${r.id}</span></h2><div class="subtext">Illustrative curve · not this run’s recorded history</div></div><div class="legend" style="font-size:9px"><span><i class="mint"></i>Training</span><span><i></i>Validation</span></div></div>${chartSvg()}</section></div><aside class="runroom-inspector"><div><div class="inspector-top"><span class="eyebrow">RUN INSPECTOR</span>${pill(r.status,r.status==='Development'?'warn':'good')}</div><div class="eyebrow" style="color:var(--orange)">${r.id}</div><div class="model-title">${r.category}</div><p class="subtext" style="margin-top:5px">${r.version} / Conv1D–BiLSTM</p><div class="inspect-metrics">${[['Accuracy',r.accuracy],['Macro F1',r.f1],['Min. sign recall',r.recall],['Epochs',r.epochs]].map(([k,v],i)=>`<div class="inspect-metric"><small>${k}</small><strong class="${i===0?'green':''}">${v}${i<3?'%':''}</strong><small>${i===3?'early-stopped':'sample metric'}</small></div>`).join('')}</div></div><div>${[['Protocol',r.protocol==='LOSO'?'LOSO · 7 folds':'70 / 15 / 15'],['Input',r.version==='Static'?'Held pose × 32':'32 × 128'],['Augmented copies','5 per original'],['Mirroring','All signs']].map(([a,b])=>`<div class="setting-line"><span>${a}</span>${b}</div>`).join('')}<button class="btn primary full" data-action="use-model">${icon('test')} Use model for testing</button><button class="btn full" data-action="export" ${r.protocol==='LOSO'?'disabled':''}>${icon('export')} Preview export</button><div class="focus-note" style="margin-top:23px;padding:0 0 0 13px;font-size:10px">${r.protocol==='LOSO'?'LOSO estimates performance on unseen signers. Use a random-split model for export.':'Synthetic results help compare the interface. Use real held-out results to select your model.'}</div></div></aside></div>`:pages[state.page]()}</main></div>`}
    function updateState(){document.getElementById('state-output').textContent=JSON.stringify({prototype:true,data:'synthetic',...state},null,2);}
    function render(){document.getElementById('app').innerHTML=state.variant==='A'?studio():state.variant==='B'?focus():runroom();renderSwitcher();updateState();}
    function renderSwitcher(){const local=['','localhost','127.0.0.1','[::1]'].includes(location.hostname);document.getElementById('switcher').hidden=!local;if(!local)return;document.getElementById('switcher').innerHTML=`<button data-cycle="-1" aria-label="Previous design">${icon('left')}</button><div class="switcher-info"><small>Design prototype · ${Object.keys(variants).indexOf(state.variant)+1} of 3</small><strong>${state.variant}</strong> <span style="color:#8b7863">/</span> ${variants[state.variant]}</div><div class="switcher-dots">${Object.keys(variants).map(k=>`<a href="?variant=${k}" data-variant="${k}" class="${state.variant===k?'active':''}" aria-label="Design ${k}: ${variants[k]}"></a>`).join('')}</div><button data-cycle="1" aria-label="Next design">${icon('chevron')}</button>`;}
    function switchVariant(key,push=true){state.variant=key;if(push){const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);}render();}
    function notify(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),3500);}
    function showModal(html){const modal=document.getElementById('modal');modal.innerHTML=html;modal.showModal();}
    const modalHeader=title=>`<div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>`;
    function configure(){showModal(`${modalHeader('Your next experiment.')}<p class="subtext">A quick setup for a simulated training run.</p>${trainingFields()}<div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="start">${icon('play')} Start simulated run</button></div>`);}
    function trainingProblem(){if(!state.development&&currentCategory().sources<currentCategory().target)return 'This sample category needs more sources. Enable Development run to continue.';if(!state.development&&(state.epochs!==150||state.augmentation!==5))return 'Enable Development run for fewer epochs or non-default augmentation.';return '';}
    function start(){if(['running','paused'].includes(state.job)){notify('A simulated run is already active. Use Pause or Cancel.');return;}const problem=trainingProblem();if(problem){notify(problem);if(!document.getElementById('modal').open)configure();return;}document.getElementById('modal').close();state.job='running';state.epoch=0;if(state.variant==='A')state.page='train';if(state.variant==='B')state.step=2;render();notify('Simulation started. No actual training job is running.');}
    function exportPreview(){const r=currentRun();if(r.protocol==='LOSO'){notify('Choose a completed random-split run to preview an export.');return;}state.exportsPreviewed++;updateState();showModal(`${modalHeader('A preview of what’s next.')}<p class="subtext">${r.id} · ${r.category} / ${r.version}</p>${pill('Preview only · no files written','warn')}<div class="bundle-tree">catalog.json\nmodels/${r.category.toLowerCase()}/preview/model.json\nmodels/${r.category.toLowerCase()}/preview/weights.bin\nmodels/${r.category.toLowerCase()}/preview/parity.json\nshared/hand_landmarker.task</div><p class="subtext">The real exporter writes a versioned local bundle. This prototype only shows its structure; compatibility has not been verified.</p><div class="modal-actions"><button class="btn primary" data-action="close-modal">Done ${icon('check')}</button></div>`);}
    function inspectRun(id){state.selectedRun=id;if(state.variant==='C'){render();return;}const r=currentRun();showModal(`${modalHeader(r.category+' / '+r.version)}<p class="subtext">${r.id} · ${r.date} · synthetic result</p><div class="inspect-metrics"><div class="inspect-metric"><small>Accuracy</small><strong class="green">${r.accuracy}%</strong></div><div class="inspect-metric"><small>Macro F1</small><strong>${r.f1}%</strong></div></div>${[['Protocol',r.protocol],['Epochs',r.epochs],['Minimum per-sign recall',r.recall+'%'],['Status',r.status]].map(([a,b])=>`<div class="setting-line"><span>${a}</span>${b}</div>`).join('')}<div class="modal-actions"><button class="btn" data-action="export" ${r.protocol==='LOSO'?'disabled':''}>Preview export</button><button class="btn primary" data-action="use-model">${icon('test')} Test this model</button></div>`);updateState();}
    const actions={
      configure,start,export:exportPreview,
      'close-modal':()=>document.getElementById('modal').close(),
      pause:()=>{state.job=state.job==='running'?'paused':'running';render();notify(state.job==='paused'?'Simulation paused.':'Simulation resumed.');},
      cancel:()=>{state.job='cancelled';render();notify('Simulated run cancelled. No files were created.');},
      scan:()=>{state.scanCount++;render();notify('Sample dataset refreshed: 8,610 sources. Your files were not scanned.');},
      extract:()=>{state.extracted=true;render();notify('Extraction preview complete. No media was processed.');},
      capture:()=>{state.prediction={expected:state.testSign,predicted:state.testSign,confidence:.964,simulated:true};render();notify('Simulated capture matched '+state.testSign+'.');},
      'use-model':()=>{document.getElementById('modal').close();if(currentRun().category!=='Alphabet'){state.selectedRun='ALP-024';notify('Recognition preview uses the sample Alphabet model.');}state.page='test';if(state.variant==='B')switchVariant('A');else render();window.scrollTo(0,0);},
      'simulate-browser':()=>notify('The real trainer launches the HUDYAT browser simulator here. This preview is disconnected.'),
      'step-next':()=>{state.step=Math.min(2,state.step+1);render();},'step-back':()=>{state.step=Math.max(0,state.step-1);render();},
      'go-studio':()=>{state.page='overview';switchVariant('A');},
      'clear-filters':()=>{state.runFilter='all';state.query='';render();},
      notifications:()=>notify('You’re all caught up. This is a sample workspace.'),
      about:()=>showModal(`${modalHeader('An idea, ready to explore.')}<p class="subtext">Three throwaway UI directions for HUDYAT Train, inspired by your reference. All metrics, curves and experiments are synthetic. Actions stay in memory and never access cameras, datasets or models.</p><div class="divider"></div><p class="subtext">A · Studio: monitor your workspace.<br>B · Focus: configure one experiment.<br>C · Runroom: inspect and compare results.</p><div class="modal-actions"><button class="btn primary" data-action="close-modal">Keep exploring ${icon('arrow')}</button></div>`)
    };
    document.addEventListener('click',event=>{const el=event.target.closest('button,a[data-variant],tr[data-run]');if(!el||el.disabled)return;if(el.dataset.cycle){const keys=Object.keys(variants),index=keys.indexOf(state.variant);switchVariant(keys[(index+Number(el.dataset.cycle)+keys.length)%keys.length]);}else if(el.dataset.variant){event.preventDefault();switchVariant(el.dataset.variant);}else if(el.dataset.page){state.page=el.dataset.page;if(state.variant==='B')switchVariant('A');else render();window.scrollTo(0,0);}else if(el.dataset.chart){state.chart=el.dataset.chart;render();}else if(el.dataset.category){state.category=el.dataset.category;render();}else if(el.dataset.step){state.step=Number(el.dataset.step);render();}else if(el.dataset.run){inspectRun(el.dataset.run);}else if(el.dataset.action){actions[el.dataset.action]?.();}updateState();});
    document.addEventListener('input',event=>{if(event.target.dataset.field!=='query')return;state.query=event.target.value;document.querySelector('tbody').innerHTML=runRows(true);updateState();});
    document.addEventListener('change',event=>{const el=event.target,key=el.dataset.field;if(!key)return;if(key==='epochs')state[key]=Math.min(150,Math.max(1,Math.round(Number(el.value)||150)));else if(key==='augmentation')state[key]=Number(el.value);else if(key==='development')state[key]=el.checked;else state[key]=el.value;if(key==='testSign')state.prediction=null;if(document.getElementById('modal').contains(el)){updateState();return;}render();});
    document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]:not([contenteditable="false"])')||document.getElementById('modal').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const keys=Object.keys(variants);switchVariant(keys[(keys.indexOf(state.variant)+(event.key==='ArrowRight'?1:2))%3]);}else if((event.key==='Enter'||event.key===' ')&&event.target.matches('tr[data-run]')){event.preventDefault();inspectRun(event.target.dataset.run);}});
    document.getElementById('modal').addEventListener('click',event=>{if(event.target===event.currentTarget){const box=event.currentTarget.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)event.currentTarget.close();}});
    window.addEventListener('popstate',()=>{const key=new URLSearchParams(location.search).get('variant');switchVariant(variants[key]?key:'A',false);});
    // shortcut: accelerated synthetic progress, replace with real job events only after a design is chosen.
    setInterval(()=>{if(state.job!=='running')return;state.epoch=Math.min(state.epochs,state.epoch+1);if(state.epoch===state.epochs){state.job='completed';notify('Simulated training complete. No model was created.');}if(!document.getElementById('modal').open&&!document.activeElement?.closest('input,select,textarea'))render();else updateState();},800);
    render();
  </script>
</body>
</html>
